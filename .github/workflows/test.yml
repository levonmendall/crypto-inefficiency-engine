name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe production dashboard contract
        shell: bash
        run: |
          set -u
          BASE="https://cie-shadow-worker-m0sc.onrender.com"
          echo "=== ROOT ==="
          curl -sS --max-time 20 -D /tmp/root.headers -o /tmp/root.html "$BASE/" || true
          cat /tmp/root.headers 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/root.html')
          text = p.read_text(errors='replace') if p.exists() else ''
          print('root_bytes=', len(text))
          for marker in ['Evidence accumulation', 'EXECUTABLE NOW', 'Portfolio Command Center', 'Mechanism truth', 'v5_mechanism_truth']:
              print(f'{marker!r}:', marker in text)
          print(text[:700].replace('\n', ' '))
          PY
          echo "=== HEALTH ==="
          curl -sS --max-time 20 -D /tmp/health.headers -o /tmp/health.json "$BASE/health" || true
          cat /tmp/health.headers 2>/dev/null || true
          cat /tmp/health.json 2>/dev/null || true
          echo
          echo "=== V5 SNAPSHOT ==="
          curl -sS --max-time 20 -D /tmp/v5.headers -o /tmp/v5.json "$BASE/v3/dashboard/v5-snapshot" || true
          cat /tmp/v5.headers 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/v5.json')
          text = p.read_text(errors='replace') if p.exists() else ''
          print('v5_bytes=', len(text))
          print(text[:1200])
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Trace production app route ownership locally
        shell: bash
        run: |
          PYTHONPATH=src python - <<'PY'
          from fastapi.testclient import TestClient
          import inefficiency_engine.dashboard_cards_v5 as v5
          import inefficiency_engine.read_api_card_history_deploy as deploy
          app = deploy.app
          print('deploy_file=', deploy.__file__)
          print('v5_file=', v5.__file__)
          print('v5_constant_bytes=', len(deploy.DASHBOARD_V5_HTML))
          for marker in ['Evidence accumulation', 'Mechanism truth', 'v5_mechanism_truth']:
              print('constant', repr(marker), marker in deploy.DASHBOARD_V5_HTML)
          direct = deploy.dashboard_root()
          direct_text = bytes(direct.body).decode(errors='replace')
          print('direct_x_contract=', direct.headers.get('x-dashboard-contract'))
          for marker in ['Evidence accumulation', 'Mechanism truth', 'v5_mechanism_truth']:
              print('direct', repr(marker), marker in direct_text)
          print('user_middleware=', app.user_middleware)
          print('=== ROOT ROUTES IN ORDER ===')
          for i, route in enumerate(app.router.routes):
              if getattr(route, 'path', None) in {'/', '/dashboard', '/health', '/v3/dashboard/snapshot', '/v3/dashboard/v5-snapshot'}:
                  endpoint = getattr(route, 'endpoint', None)
                  print(i, getattr(route, 'path', None), getattr(route, 'methods', None), getattr(endpoint, '__module__', None), getattr(endpoint, '__name__', None), endpoint is deploy.dashboard_root)
          client = TestClient(app)
          response = client.get('/')
          print('local_root_status=', response.status_code)
          print('local_root_history=', [(r.status_code, r.headers.get('location')) for r in response.history])
          print('local_root_x_contract=', response.headers.get('x-dashboard-contract'))
          for marker in ['Evidence accumulation', 'Mechanism truth', 'v5_mechanism_truth']:
              print('local', repr(marker), marker in response.text)
          health = client.get('/health').json()
          print('local_health_version=', health.get('version'))
          print('local_health_contract=', health.get('dashboard_ui_contract_version'))
          PY
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src
