name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe production dashboard and bottlenecks
        shell: bash
        run: |
          set -u
          BASE="https://cie-shadow-worker-m0sc.onrender.com"
          echo "=== ROOT ==="
          curl -sS --max-time 20 -D /tmp/root.headers -o /tmp/root.html "$BASE/" || true
          cat /tmp/root.headers 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/root.html').read_text(errors='replace') if Path('/tmp/root.html').exists() else ''
          print('root_bytes=', len(text))
          for marker in ['Evidence accumulation', 'Mechanism truth', 'v5_mechanism_truth']:
              print(f'{marker!r}:', marker in text)
          PY
          echo "=== HEALTH ==="
          curl -sS --max-time 20 -o /tmp/health.json "$BASE/health" || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/health.json')
          data=json.loads(p.read_text()) if p.exists() and p.read_text().strip() else {}
          print('release_commit=',data.get('release_commit'),'version=',data.get('version'),'final_router=',data.get('dashboard_final_router_rebuilt'))
          workers=((data.get('runtime_heartbeats') or {}).get('workers') or {})
          for name,row in workers.items():
              print('worker',name,'state=',row.get('state'),'available=',row.get('available'),'stale=',row.get('stale'),'age=',row.get('age_seconds'),'error=',row.get('error_type'),'at=',row.get('observed_at'))
          PY
          echo "=== V5 MECHANISM TRUTH ==="
          curl -sS --max-time 30 -o /tmp/v5.json "$BASE/v3/dashboard/v5-snapshot" || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/v5.json')
          data=json.loads(p.read_text()) if p.exists() and p.read_text().strip() else {}
          print('generated_at=',data.get('generated_at'),'release=',data.get('release_commit'))
          print('summary=',json.dumps(data.get('summary') or {},sort_keys=True))
          print('system=',json.dumps(data.get('system') or {},sort_keys=True))
          keys=['mechanism_id','status','provider_status','evidence_status','source_state','source_item_count','source_age_seconds','independent_source_count','missing_evidence_classes','research_status','research_worker_state','research_worker_error','research_last_at','research_due_at','research_due_state','persisted_state','stage','raw_candidate_count','emitted_candidate_count','signal_count','forward_outcome_count','forward_target','qualified_count','paper_capable','settled_count','certified','mean_forward_net_return','forward_hit_rate','best_net_economics','required_net_economics','gap_to_hurdle','dominant_rejection_gate','primary_blocker','next_action']
          for card in data.get('cards') or []:
              print('CARD',json.dumps({k:card.get(k) for k in keys},sort_keys=True))
          PY
          echo "=== WORKER IMPLEMENTATION REFERENCES ==="
          grep -R -n -E 'priority-source-refresh-plane|mechanism-forward-evidence|alpha-l2-research-sampling' src tests || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify ASGI dashboard dispatch
        run: |
          PYTHONPATH=src python - <<'PY'
          from fastapi.testclient import TestClient
          from inefficiency_engine.read_api_card_history_deploy import app
          response = TestClient(app).get('/')
          print('status=', response.status_code)
          print('contract=', response.headers.get('x-dashboard-contract'))
          print('v5=', 'Mechanism truth' in response.text)
          print('legacy=', 'Evidence accumulation' in response.text)
          assert response.status_code == 200
          assert response.headers.get('x-dashboard-contract') == 'v5_mechanism_truth'
          assert 'Mechanism truth' in response.text
          assert 'Evidence accumulation' not in response.text
          PY
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src
