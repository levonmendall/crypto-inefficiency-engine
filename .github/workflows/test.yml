name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src
      - name: Install research dependency
        if: github.head_ref == 'research/convex-scout-backtest'
        run: python -m pip install 'duckdb>=1.1,<2'
      - name: Convex Scout historical replay
        if: github.head_ref == 'research/convex-scout-backtest'
        run: python research/convex_scout_backtest.py --output convex-scout-backtest.json
      - name: Upload Convex Scout report
        if: github.head_ref == 'research/convex-scout-backtest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: convex-scout-backtest
          path: convex-scout-backtest.json
          if-no-files-found: warn
