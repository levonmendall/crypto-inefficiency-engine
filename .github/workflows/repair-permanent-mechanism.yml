name: Permanent mechanism-forward repair

on:
  push:
    branches: [repair/permanent-mechanism-forward-worker]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/permanent-mechanism-forward-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply focused repair
        run: python .github/repair_permanent_mechanism_forward.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run mechanism-forward qualification as permanent worker"
          git push origin HEAD:repair/permanent-mechanism-forward-worker
