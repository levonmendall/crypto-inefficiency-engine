name: Solana Alpha Certification

on:
  push:
    branches: [research/solana-alpha-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  episode-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build deterministic multi-wallet episode universe
        run: python research/solana_alpha_episode_universe.py
      - name: Upload locked episode universe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-alpha-episode-universe
          path: solana-alpha-episode-universe.json
