name: Solana Alpha Certification

on:
  push:
    branches: [research/solana-alpha-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-availability:
    runs-on: ubuntu-latest
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
      BITQUERY_API_KEY: ${{ secrets.BITQUERY_API_KEY }}
      SHYFT_API_KEY: ${{ secrets.SHYFT_API_KEY }}
    steps:
      - name: Helius credential available
        if: ${{ env.HELIUS_API_KEY != '' }}
        run: echo available
      - name: Birdeye credential available
        if: ${{ env.BIRDEYE_API_KEY != '' }}
        run: echo available
      - name: Bitquery credential available
        if: ${{ env.BITQUERY_API_KEY != '' }}
        run: echo available
      - name: Shyft credential available
        if: ${{ env.SHYFT_API_KEY != '' }}
        run: echo available
      - name: Provider availability probe complete
        run: echo complete

  historical-rpc-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public Solana historical RPC coverage
        shell: bash
        run: |
          set -o pipefail
          python research/solana_alpha_rpc_probe.py 2>&1 | tee solana-alpha-rpc-probe.log
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-alpha-rpc-probe
          path: solana-alpha-rpc-probe.log
