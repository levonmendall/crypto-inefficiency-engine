name: Solana Alpha Certification

on:
  push:
    branches: [research/solana-alpha-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kol-history-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe raw token-history metadata
        run: python research/kolexplorer_history_probe.py
