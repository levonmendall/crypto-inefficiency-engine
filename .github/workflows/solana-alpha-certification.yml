name: Solana Alpha Certification

on:
  push:
    branches: [research/solana-alpha-certification]
  workflow_dispatch:

concurrency:
  group: solana-alpha-certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  token-replay-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay deterministic locked holdout probes
        run: python research/solana_token_replay_probe.py
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-token-replay-probe
          path: solana-token-replay-probe.json
