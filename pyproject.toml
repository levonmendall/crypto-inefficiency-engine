[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-inefficiency-engine"
version = "3.5.24"
description = "Paper-first crypto opportunity engine with a worker-owned heavy compute plane, a PostgreSQL-backed lightweight production read API, canonical-first runtime isolation, rotating bounded shadow L2 evaluation, live evidence-card telemetry, bounded dashboard API waits, raw-market canonical accounting, progressive profitability certification, and fail-closed paper-only execution authority."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1", "pyyaml>=6,<7"]

[project.scripts]
cie = "inefficiency_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
