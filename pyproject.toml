[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-inefficiency-engine"
version = "3.5.13"
description = "Paper-first crypto opportunity engine with canonical-first two-domain runtime isolation, one provider-free supervisor, settlement-compatible canonical allocation, bounded auxiliary research/certification, fail-closed portfolio watchdog recovery, persistent $250,000 compounding accounting, mobile Portfolio Command Center, forward-evidence health telemetry, and progressive profitability certification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1", "pyyaml>=6,<7"]

[project.scripts]
cie = "inefficiency_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
