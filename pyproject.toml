[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-inefficiency-engine"
version = "3.5.23"
description = "Paper-first crypto opportunity engine with canonical-first runtime isolation, rotating bounded shadow L2 evaluation, result-releasing sequential research, Blueprint-safe worker compute retention, live evidence-card telemetry, bounded dashboard API waits, lightweight ledger-only portfolio reads, raw-market canonical accounting, bounded L2 promotion, progressive profitability certification, and read-only per-mechanism evidence visibility."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1", "pyyaml>=6,<7"]

[project.scripts]
cie = "inefficiency_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
