services:
  - type: worker
    name: cie-shadow-worker
    runtime: python
    region: oregon
    # Intentionally omit `plan` for the existing worker. Render retains the
    # instance type selected in the dashboard when a Blueprint omits this field.
    # Pinning `starter` here would silently downgrade a manual RAM upgrade back to
    # 512 MB on the next Blueprint sync/deploy.
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install --retries 20 --timeout 120 .
    startCommand: cie worker
    maxShutdownDelaySeconds: 90
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cie-evidence
          property: connectionString
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: CIE_PAPER_ONLY
        value: "true"
      - key: CIE_SHADOW_HORIZONS_SECONDS
        value: "1,5,15,30,60"
      - key: CIE_SHADOW_MAX_OPPORTUNITIES
        value: "16"
      - key: CIE_SHADOW_MAX_CANDIDATES
        value: "80"
      - key: CIE_DEX_ROUTE_TIER_SHADOW_MAX_CONCURRENCY
        value: "1"
      - key: CIE_SHADOW_CYCLE_INTERVAL_SECONDS
        value: "30"
      - key: CIE_SHADOW_NOTIONAL_USD
        value: "1000"
      - key: CIE_EXPECTED_ORDER_ACK_LATENCY_MS
        value: "0"
      - key: CIE_EXPECTED_HEDGE_LATENCY_MS
        value: "750"
      - key: CIE_EMPIRICAL_LATENCY_ENABLED
        value: "true"
      - key: CIE_EMPIRICAL_LATENCY_MIN_SAMPLES
        value: "100"
      - key: CIE_EMPIRICAL_LATENCY_MIN_SCAN_SAMPLES
        value: "30"
      - key: CIE_EMPIRICAL_LATENCY_MIN_EFFECTIVE_SAMPLES
        value: "30"
      - key: CIE_EMPIRICAL_LATENCY_QUANTILE
        value: "0.95"
      - key: CIE_EMPIRICAL_PROBABILITY_CONFIDENCE_LEVEL
        value: "0.95"
      - key: CIE_EMPIRICAL_PROBABILITY_MAX_CI_WIDTH
        value: "0.25"
      - key: CIE_WORKER_ERROR_BACKOFF_SECONDS
        value: "15"
      - key: CIE_WORKER_HEARTBEAT_STALE_SECONDS
        value: "180"

  - type: web
    name: cie-shadow-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    # Deploy the API from main after repository checks pass, matching the worker.
    # Deployment safety is handled by the lightweight process-local /health path,
    # lazy read-only database bootstrap, bounded DB waits, and bounded pip retries;
    # disabling auto-deploy here would leave the API pinned to stale code.
    autoDeployTrigger: checksPass
    # Bound dependency retries so an external package/network failure becomes an
    # explicit failed deploy instead of an opaque 15+ minute spinner.
    buildCommand: python -m pip install --retries 5 --timeout 30 .
    # Production web remains a deployment-safe read plane: process-local liveness,
    # separate bounded database readiness, no schema ownership, no heavy compute.
    # Research-closure diagnostics consume compact append-only summaries only.
    startCommand: uvicorn inefficiency_engine.read_api_research_deploy:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cie-evidence
          property: connectionString
      - key: CIE_PAPER_ONLY
        value: "true"
      - key: CIE_SHADOW_HORIZONS_SECONDS
        value: "1,5,15,30,60"
      - key: CIE_SHADOW_CYCLE_INTERVAL_SECONDS
        value: "30"
      - key: CIE_WORKER_HEARTBEAT_STALE_SECONDS
        value: "180"

databases:
  - name: cie-evidence
    plan: basic-256mb
    region: oregon
    databaseName: cie_evidence
    user: cie
    ipAllowList: []
