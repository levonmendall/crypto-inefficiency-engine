services:
  - type: web
    name: cie-shadow-worker
    runtime: python
    region: oregon
    # Consolidated paid runtime: one Standard web instance owns both the public
    # read API and the governed worker compute plane. Render service type is
    # immutable, so the existing background-worker resource must be recreated once
    # as this web service during the Blueprint migration; afterward this remains the
    # single paid compute service for the crypto engine.
    plan: standard
    branch: main
    autoDeployTrigger: checksPass
    # Install dependencies from the current checkout without reusing a stale local
    # project wheel. Runtime imports are then pinned directly to ./src so a Render
    # deploy cannot report the latest Git SHA while executing an older installed
    # copy of the application package.
    buildCommand: python -m pip install --retries 5 --timeout 30 --no-cache-dir .
    # Large production read indexes are intentionally maintained only after the API
    # has bound its Render port. This keeps multimillion-row DDL out of the deploy
    # startup deadline while preserving serial table bootstrap before child startup.
    # Durable lane history is also materialized post-bind in an independent bounded
    # child so dashboard requests never reconstruct historical ledgers themselves.
    startCommand: PYTHONPATH=src python -m inefficiency_engine.render_combined_postbind_history_projection
    healthCheckPath: /health
    maxShutdownDelaySeconds: 90
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cie-evidence
          property: connectionString
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: CIE_PAPER_ONLY
        value: "true"
      # Bybit blocks public API traffic from US IP space. The Oregon production
      # service therefore treats Bybit as policy-disabled rather than repeatedly
      # recording 403s as data failures. Existing Coinbase/Kraken/OKX/Hyperliquid/
      # Deribit/protocol-native surfaces remain the production evidence routes.
      - key: CIE_BYBIT_PUBLIC_ENABLED
        value: "false"
      # Executable market/L2 acquisition is a rotating four-asset hot path. It must
      # complete comfortably inside the unchanged 120-second downstream freshness
      # boundary. The broad top-25 research sweep runs independently and cannot block
      # this cadence.
      - key: CIE_SOURCE_MARKET_INTERVAL_SECONDS
        value: "30"
      - key: CIE_SOURCE_EXECUTABLE_DEADLINE_SECONDS
        value: "45"
      - key: CIE_SOURCE_RESEARCH_INTERVAL_SECONDS
        value: "300"
      - key: CIE_SOURCE_PRIORITY_INTERVAL_SECONDS
        value: "60"
      - key: CIE_SOURCE_L2_ASSET_BATCH_SIZE
        value: "4"
      # Mechanism-forward evidence is independently supervised. One cycle is bounded
      # below the unchanged 120-second source-freshness contract so a wedged forward
      # evaluation cannot leave the process alive but the evidence funnel unobserved.
      - key: CIE_MECHANISM_FORWARD_INTERVAL_SECONDS
        value: "30"
      - key: CIE_MECHANISM_FORWARD_DEADLINE_SECONDS
        value: "90"
      # Canonical control is database-only and has no provider authority. It must
      # either reconcile/publish promptly or expose an explicit timeout heartbeat;
      # it may never wait on live L2/provider I/O.
      - key: CIE_CONTROL_INTERVAL_SECONDS
        value: "30"
      - key: CIE_CONTROL_CYCLE_DEADLINE_SECONDS
        value: "25"
      - key: CIE_SHADOW_HORIZONS_SECONDS
        value: "1,5,15,30,60"
      - key: CIE_SHADOW_MAX_OPPORTUNITIES
        value: "16"
      - key: CIE_SHADOW_MAX_CANDIDATES
        value: "80"
      - key: CIE_DEX_ROUTE_TIER_SHADOW_MAX_CONCURRENCY
        value: "1"
      - key: CIE_SHADOW_CYCLE_INTERVAL_SECONDS
        value: "30"
      - key: CIE_SHADOW_NOTIONAL_USD
        value: "1000"
      - key: CIE_EXPECTED_ORDER_ACK_LATENCY_MS
        value: "0"
      - key: CIE_EXPECTED_HEDGE_LATENCY_MS
        value: "750"
      - key: CIE_EMPIRICAL_LATENCY_ENABLED
        value: "true"
      - key: CIE_EMPIRICAL_LATENCY_MIN_SAMPLES
        value: "100"
      - key: CIE_EMPIRICAL_LATENCY_MIN_SCAN_SAMPLES
        value: "30"
      - key: CIE_EMPIRICAL_LATENCY_MIN_EFFECTIVE_SAMPLES
        value: "30"
      - key: CIE_EMPIRICAL_LATENCY_QUANTILE
        value: "0.95"
      - key: CIE_EMPIRICAL_PROBABILITY_CONFIDENCE_LEVEL
        value: "0.95"
      - key: CIE_EMPIRICAL_PROBABILITY_MAX_CI_WIDTH
        value: "0.25"
      - key: CIE_WORKER_ERROR_BACKOFF_SECONDS
        value: "15"
      - key: CIE_WORKER_HEARTBEAT_STALE_SECONDS
        value: "180"

databases:
  - name: cie-evidence
    plan: basic-256mb
    region: oregon
    databaseName: cie_evidence
    user: cie
    ipAllowList: []
