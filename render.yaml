services:
  - type: web
    name: cie-shadow-worker
    runtime: python
    region: oregon
    # Consolidated paid runtime: one Standard web instance owns both the public
    # read API and the governed worker compute plane. Render service type is
    # immutable, so the existing background-worker resource must be recreated once
    # as this web service during the Blueprint migration; afterward this remains the
    # single paid compute service for the crypto engine.
    plan: standard
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install --retries 5 --timeout 30 .
    startCommand: python -m inefficiency_engine.render_combined_card_history
    healthCheckPath: /health
    maxShutdownDelaySeconds: 90
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cie-evidence
          property: connectionString
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: CIE_PAPER_ONLY
        value: "true"
      - key: CIE_SHADOW_HORIZONS_SECONDS
        value: "1,5,15,30,60"
      - key: CIE_SHADOW_MAX_OPPORTUNITIES
        value: "16"
      - key: CIE_SHADOW_MAX_CANDIDATES
        value: "80"
      - key: CIE_DEX_ROUTE_TIER_SHADOW_MAX_CONCURRENCY
        value: "1"
      - key: CIE_SHADOW_CYCLE_INTERVAL_SECONDS
        value: "30"
      - key: CIE_SHADOW_NOTIONAL_USD
        value: "1000"
      - key: CIE_EXPECTED_ORDER_ACK_LATENCY_MS
        value: "0"
      - key: CIE_EXPECTED_HEDGE_LATENCY_MS
        value: "750"
      - key: CIE_EMPIRICAL_LATENCY_ENABLED
        value: "true"
      - key: CIE_EMPIRICAL_LATENCY_MIN_SAMPLES
        value: "100"
      - key: CIE_EMPIRICAL_LATENCY_MIN_SCAN_SAMPLES
        value: "30"
      - key: CIE_EMPIRICAL_LATENCY_MIN_EFFECTIVE_SAMPLES
        value: "30"
      - key: CIE_EMPIRICAL_LATENCY_QUANTILE
        value: "0.95"
      - key: CIE_EMPIRICAL_PROBABILITY_CONFIDENCE_LEVEL
        value: "0.95"
      - key: CIE_EMPIRICAL_PROBABILITY_MAX_CI_WIDTH
        value: "0.25"
      - key: CIE_WORKER_ERROR_BACKOFF_SECONDS
        value: "15"
      - key: CIE_WORKER_HEARTBEAT_STALE_SECONDS
        value: "180"

databases:
  - name: cie-evidence
    plan: basic-256mb
    region: oregon
    databaseName: cie_evidence
    user: cie
    ipAllowList: []
