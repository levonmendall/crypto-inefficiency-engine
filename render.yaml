services:
  - type: worker
    name: cie-shadow-worker
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install .
    startCommand: cie worker
    maxShutdownDelaySeconds: 90
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cie-evidence
          property: connectionString
      - key: CIE_PAPER_ONLY
        value: "true"
      - key: CIE_SHADOW_DELAY_SECONDS
        value: "5"
      - key: CIE_SHADOW_CYCLE_INTERVAL_SECONDS
        value: "30"
      - key: CIE_SHADOW_NOTIONAL_USD
        value: "1000"
      - key: CIE_WORKER_ERROR_BACKOFF_SECONDS
        value: "15"
      - key: CIE_WORKER_HEARTBEAT_STALE_SECONDS
        value: "180"

  - type: web
    name: cie-shadow-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install .
    startCommand: uvicorn inefficiency_engine.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cie-evidence
          property: connectionString
      - key: CIE_PAPER_ONLY
        value: "true"
      - key: CIE_WORKER_HEARTBEAT_STALE_SECONDS
        value: "180"

databases:
  - name: cie-evidence
    plan: basic-256mb
    region: oregon
    databaseName: cie_evidence
    user: cie
    ipAllowList: []
